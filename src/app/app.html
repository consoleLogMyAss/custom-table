<app-my-table
  [tableData]="tableData"
  [columnData]="columnData"
>
  <table-head>
    <ng-template field="name">
      <input type="text" />
    </ng-template>

    <ng-template field="job">
      <input type="number" />
    </ng-template>
  </table-head>

  <table-body>
    <ng-template field="name" let-row>
      <strong style="color: green;">{{ row.name }}</strong>
    </ng-template>

    <ng-template field="country" let-row>
      <strong style="color: violet;">{{ row.country }}</strong>
    </ng-template>

    <ng-template field="job" let-row>
      <strong style="color: blue">{{ row.job }}</strong>
    </ng-template>
  </table-body>
</app-my-table>
