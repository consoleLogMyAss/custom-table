<tr>
  @for (column of columnData(); track $index) {
    @if (templatesMap.get(column.field)) {
      <th>
        <div>
          <div>{{ column.title }}</div>
          <div>
            <ng-container
              *ngTemplateOutlet="templatesMap.get(column.field)"
            />
          </div>
        </div>
      </th>
    } @else {
      <th>{{ column.title }}</th>
    }
  }
</tr>
